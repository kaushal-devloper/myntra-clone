services:
  - type: web
    name: myntra-backend
    env: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: node routes/server.js
    healthCheckPath: /
    envVars:
      - key: MONGO_URI
        sync: false   # Set this manually in Render dashboard
      - key: JWT_SECRET
        sync: false   # Set this manually in Render dashboard
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
